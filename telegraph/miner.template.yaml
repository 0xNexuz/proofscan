version: '1'
kind: miner
id: __MINER_ID__
slug: proofscan-claim-verification
protocol: generic
name: ProofScan Claim Verification
description: Evidence-bearing claim verification with explicit contradiction, abstention, provenance, and freshness signals.
base_url: __BASE_URL__

auth:
  type: header
  header_name: X-ProofScan-Key
  env_var: PROOFSCAN_API_KEY

rate_limit_per_sec: 5
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30

limitations:
  - code: MAX_PARAM_SIZE
    message: Claim length is limited to 4,000 characters.
    param: claim
    property: length
    value_num: 4000
    operator: lte
  - code: MAX_BODY_SIZE
    message: Inline evidence is limited to 100 KB.
    param: evidence
    property: size_bytes
    value_bytes: 100000
    operator: lte

endpoints:
  - path: /verify
    external_path: /v1/verify
    method: POST
    description: Verify whether supplied evidence supports a claim.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: verdict
    reason_field: reason
  supported_intents:
    - FACT_CHECK

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: verdict
        source_path: verdict
      - index: 1
        name: reason
        source_path: reason
      - index: 2
        name: evidence_span
        source_path: evidenceSpan
    integers:
      - index: 0
        name: confidence_x10000
        source_path: confidence
        multiplier: 10000
  request:
    - endpoint: verify
      method: POST
      body:
        claim: { source: strings.0 }
        evidence: { source: strings.1 }
        source: { source: strings.2, optional: true }
        asOf: { source: strings.3, optional: true }
