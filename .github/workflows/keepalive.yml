name: proofscan-uptime-probe

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

jobs:
  health:
    if: ${{ vars.PROOFSCAN_PUBLIC_URL != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Probe the public health endpoint
        env:
          PROOFSCAN_PUBLIC_URL: ${{ vars.PROOFSCAN_PUBLIC_URL }}
        run: |
          curl --fail --show-error --silent \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            "${PROOFSCAN_PUBLIC_URL%/}/health"
